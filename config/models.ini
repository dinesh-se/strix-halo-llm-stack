; ============================================================================
; llama-server ROUTER preset — PRODUCTION (2026-08-09)
; ============================================================================
; This file replaces config/llama-swap.yaml. llama-swap is gone; llama.cpp's
; own router server (`llama-server` launched with no -m) owns model lifecycle.
;
; Keys are llama-server LONG options minus the leading dashes. `[*]` is the
; shared default section. Section name IS the model id clients request, and the
; router OVERWRITES --alias with it — see the alias note below.
;
; ---------------------------------------------------------------------------
; ROLE ALIAS MAPPING — llama-swap had `aliases:`, the router does NOT.
; The router overwrites alias with the section name and reports "aliases": [].
; These three role names are therefore GONE and their consumers now pin a
; concrete id. Recorded here so the next session can find them:
;   classifier    -> gemma4-e4b        (~/Dev/automated-workflows/.env +
;                                      workers/llm.py — cheap aux, correct for
;                                      email/intent classification, VERIFIED 2026-08-09)
;   extractor     -> gemma4-e4b       (Hindsight reflect,
;                                      HINDSIGHT_API_REFLECT_LLM_MODEL — was
;                                      deepseek-v4-flash, then qwen3.6-35b,
;                                      retargeted to gemma4-e4b 2026-08-12)
;   memory-writer -> gemma4-e4b        (Hindsight retain + consolidation)
;
; ⚠️ The `extractor` pin (Hindsight reflect) was retargeted to qwen3.6-35b on
; 2026-08-09 to stay on a resident heavy model, then to gemma4-e4b on 2026-08-12
; (qwen paused 2026-08-15; DS4 is resident now). If a model is ever swapped,
; these consumers must be edited by hand. That is the protection the aliases used
; to provide, and it no longer exists.
; ---------------------------------------------------------------------------
;
; ⚠️ MODEL DISCOVERY IS NOT CONFIGURABLE. There is no allowlist/disable flag —
; only --models-dir / --models-preset / --models-max / --models-autoload, and
; --models-max caps model COUNT, not SIZE. Left unguarded, one stray model id
; would load Qwen3.5-122B (73 GiB) on top of DS4 and take the box down.
; MITIGATION (in llama-router.service, keep them together):
;   - only the needed model repos are bind-mounted, at /models/ds4, /models/aux,
;     and /models/qwen38 — nothing else is reachable from inside
;     the container
;   - LLAMA_CACHE points at an empty directory so cache auto-discovery finds
;     nothing to enumerate
;
; ⚠️ ORDER MATTERS. gemma4-e4b is deliberately FIRST: DS4 takes 3–11 minutes to
; load, so the cheap model must be serving within seconds of a boot/restart or
; every consumer (notably Hindsight) 502-storms through the whole window.
version = 1

[*]
flash-attn = on
; -cram 0 disables llama-server's default 8192 MiB/model HOST-RAM prompt cache.
; This was the root cause of the 2026-07-19 host-RAM OOM kills, and it matters
; MORE here: DS4 leaves ~14 GiB of host RAM and that cache is not capacity-
; enforced on Linux (ggml-org/llama.cpp#22629).
cache-ram = 0
; REQUIRED. Without it children serve no /metrics, llama-watchdog's llamacpp:*
; relay produces nothing, and the `ai-stack-llama-queue` alert has
; noDataState: OK — so it goes SILENTLY dead rather than firing. Every
; llama-swap cmd carried --metrics; it was missing from the first draft.
metrics = true
no-webui = true
jinja = true
cache-type-k = q8_0
cache-type-v = q8_0
n-gpu-layers = 999

; ---------------------------------------------------------------------------
; AUX — all background work: Hermes compression/title-gen/curator/
; background_review/delegation, and Hindsight retain + consolidation.
; Kept resident (load-on-startup, no sleep-idle): 4.9 GiB is cheap, and this is
; the model that answers title-generation on turn 1 of every session.
; ---------------------------------------------------------------------------
; MEASURED 2026-08-06 with DS4 co-resident: GTT 98.4 -> 103.3 (+4.9 GiB),
; MemAvail 19.9 -> 14.7, decode 114 t/s, cold prefill 858 t/s, and 4 concurrent
; requests in 0.8 s wall with requests_deferred = 0.
; It REPLACES gemma4-12b, which cost 11.4 GiB and left only 8.5 GiB of host RAM
; — the exact band that OOM-killed llama-server twice on 2026-08-06 morning.
[gemma4-e4b]
model = /models/aux/snapshots/8c5a9e4fd5482e2be20fe0bf013b4c262a8f4265/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
model-draft = /models/aux/snapshots/8c5a9e4fd5482e2be20fe0bf013b4c262a8f4265/MTP/mtp-gemma-4-E4B-it-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
; 131072, raised from 65536 on 2026-08-06 (22:00). At 65536 with `parallel 4`
; + kv-unified, four concurrent aux calls shared ONE 64k buffer (~16k each) —
; Hermes compression plus Hindsight retain batches exceeded it and the child
; logged 2x `failed to find free space in the KV cache, retrying with smaller
; batch size`. Both self-recovered, but that is the same warning shape that
; preceded the 2026-08-01 device-lost wedge. Costs ~1 GiB of ~13 GiB free.
; ⚠️ 3-WAY SYNC: this must match `auxiliary.compression.context_length` AND
; `custom_providers[DS4].models.gemma4-e4b.context_length` in ~/.hermes/config.yaml,
; and `contextWindow` in ~/.pi/agent/models.json.
ctx-size = 131072
batch-size = 2048
ubatch-size = 2048
; parallel 4 covers Hindsight's real fan-out: RETAIN_LLM_MAX_CONCURRENT=2 plus
; CONSOLIDATION_LLM_PARALLELISM=2 (hindsight-daemon.service:194,170). Must be
; changed in lockstep with those two.
parallel = 4
kv-unified = true
; -sps 0.5, not llama.cpp's 0.10 default. At 0.10 a short prompt scores
; f_sim ~0.15 off the shared chat-template preamble alone and gets routed onto
; a slot holding a long prefix, destroying it. f_sim is normalised by the
; INCOMING prompt length, not the slot's. See prefill-amplification-2026-08-02.
slot-prompt-similarity = 0.5
; Gemma 4 GGUFs ship a vision projector that would otherwise auto-load (~1 GiB).
no-mmproj = true
; Gemma 4 thinks by default even unprompted. Callers also send
; chat_template_kwargs.enable_thinking=false; this is the server-side backstop.
reasoning-budget = 8192
reasoning-budget-message = Thinking budget exhausted. Stop reasoning and produce the final response now.
temp = 1.0
top-p = 0.95
top-k = 64
load-on-startup = true

; ---------------------------------------------------------------------------
; DS4 — primary resident heavy model. General chat, web search, scrape,
; agentic work, Hermes/pi default, all pi-kalam roles, Hindsight reflect,
; Open WebUI, email digest. THE DAILY DRIVER — resident since 2026-08-15, and
; re-confirmed 2026-08-20 after the qwen3.8-27b evaluation concluded: the 27b is
; faster per token but runs parallel = 1 with reasoning always on, so it loses on
; real multi-caller work. Coexists with gemma4-e4b (98.4 + 4.9 = 103.3 GiB <
; 120 GB cap). The only on-demand swap target is now the qwen3.8-27b-q4 section
; at the bottom of this file.
; ---------------------------------------------------------------------------
; ⚠️ ~98.4 GiB. Cold load 3–11 min depending on page cache. It cannot coexist
; with image generation (sd.cpp needs ~19 GiB GTT + 8.7 GiB host RAM for its
; CPU text encoder) — that is what the image-gen eviction wrapper is for.
;
; ⚠️ -c 131072 is NOT the memory lever. DS4's KV is ~4.5 MiB per 1k tokens
; (MLA + q8_0): MEASURED 16k bare 97.9 GiB vs 128k bare 98.4 GiB. Shrinking
; ctx saves nothing; the weights are the entire footprint.
;
; ⚠️ dspark sidecar deliberately ABSENT. It buys ~30% decode (18.99 -> 24.55)
; but costs ~10 GiB, taking GTT to 108.1 and host RAM to ~9 GiB, which
; OOM-killed llama-server twice on 2026-08-06 on one 23,412-token prompt.
; Draft acceptance on that real workload was only 0.583, under the 0.70 floor.
[deepseek-v4-flash]
model = /models/ds4/snapshots/1290dcca3f84612f646fb546fb9e8433c1b339b0/UD-IQ3_XXS/DeepSeek-V4-Flash-0731-UD-IQ3_XXS-00001-of-00004.gguf
ctx-size = 262144
batch-size = 2048
; -ub is a MEASURED NON-LEVER on DS4 (0.4% PP / 1.6% TG across 512/1024/2048).
; Do not spend time tuning it, unlike the 27b where the curve was steep.
ubatch-size = 1024
; parallel 2, NOT 1. Every consumer now lands on this one model — Hermes and pi
; defaults, all 5 pi-kalam roles, Hindsight reflect, Open WebUI, the email
; digest. With a single slot, head-of-line blocking is the biggest UX
; regression in this migration: one long agentic turn stalls everything else.
; It is nearly free here — DS4's KV is ~4.5 MiB per 1k tokens, so a second
; 128k slot costs ~0.5 GiB (MEASURED: 16k bare 97.9 GiB vs 128k bare 98.4).
; ⚠️ kv-unified MUST stay explicit. Setting -np makes slots non-auto, which
; flips unified OFF and splits n_ctx into N x (131072/N) — at -np 2 that landed
; exactly on Hermes' 64k MINIMUM_CONTEXT_LENGTH floor with zero margin.
;
; 2 -> 3 on 2026-08-07. llama-watchdog now PINS its 60s probe to the LAST slot
; (`id_slot`), because an unpinned 2-token probe scores f_sim ~0, falls through
; to LRU, and OVERWRITES whatever cached prefix is sitting on the idle slot —
; MEASURED destroying DS4 slot 1 (n_prompt 294 -> 1) and gemma4 slot 3
; (2443 -> 1). Pinning confines that damage to ONE slot. To be precise about
; what the 3rd slot buys: the probe releases in ~0.08s, so it never blocks
; availability and head-of-line blocking is NOT the issue — what it destroys is
; CACHE RETENTION on its slot, every 60s. At -np 2 that left exactly one slot
; able to hold a conversation across turns. At -np 3, two can.
; Cost is compute buffers only (~0.25 GB measured on the 35b for +1 slot); under
; kv-unified the KV buffer is n_ctx TOTAL, so 131072 is still shared, not split.
parallel = 3
kv-unified = true
cache-reuse = 256
; -sps 0.5, not llama.cpp's 0.10 default — same rationale as [gemma4-e4b].
; ⚠️ This does NOT fix a context compaction: a compaction rewrites the prefix, so
; f_sim collapses legitimately (MEASURED 0.992 -> below 0.10 in one turn on
; 2026-08-07) and a full re-prefill is unavoidable. What 0.5 buys is protection
; from the many SHORT callers on this model (Hindsight reflect, Open WebUI,
; pi-kalam roles) scoring ~0.15 off the shared chat-template preamble alone and
; being routed onto the slot holding a 76k prefix, destroying it.
slot-prompt-similarity = 0.5
; RESIDENT at boot. DS4 is the daily driver; every unattended caller (both
; check-in crons, Hermes model.default, OpenWebUI, the overnight cycle) is pinned
; to it, which is what keeps gotcha #6 closed — see docs/infra/current.md.
load-on-startup = true

; ---------------------------------------------------------------------------
; qwen3.8-27b-q4 — the ONLY on-demand swap target (2026-08-20).
; UD-Q4_K_XL, ~34 GiB resident at the full 262144 ctx. Load only after evicting
; DS4 (34 + 98.4 + 4.9 > 124 GiB cap) — use `swap-model.sh qwen`, never a bare
; request, and never while a cron may ask for DS4 (that thrash OOM'd the router
; on 2026-08-19 21:37: the heavy mutex guards CO-RESIDENCY, not CONTENTION).
;
; The Q8_0 twin was DELETED on 2026-08-20 along with its 29 GB GGUF: strictly
; worse on every axis (21.3 vs 31.3 t/s decode, +11 GiB) once spec-draft-n-max
; was tuned. Do not re-add it.
;
; Text-only (no-mmproj); vision is a follow-up. Default xhigh reasoning KEPT (no
; reasoning-budget) — the model's native behaviour, deliberately unmodified.
; ---------------------------------------------------------------------------
[qwen3.8-27b-q4]
model = /models/qwen38/Qwen3.8-27B-UD-Q4_K_XL.gguf
; MTP speculative decoding. NO separate draft file: the MTP layer is EMBEDDED in
; the main GGUF (verified 2026-08-19 by parsing the tensor table — 866 tensors
; incl. blk.64.nextn.{eh_proj,enorm,hnorm,shared_head_norm}, and metadata
; qwen35.nextn_predict_layers = 1). Unlike gemma4-e4b, which needs an explicit
; model-draft sidecar.
spec-type = draft-mtp
; spec-draft-n-max = 5, NOT 12. TUNED 2026-08-19 and it is the single biggest
; lever on this model — BIGGER THAN THE QUANT. Longer drafts collapse acceptance
; (0.81 at n=3 -> 0.25 at n=20) and waste the batched verify pass.
; MEASURED on UD-Q4_K_XL (code prompt, greedy):
;   n=3 29.47 | n=5 31.05 | n=6 30.21 | n=7 27.24 | n=12 19.03 | n=20 15.16
; The published KyaniteLabs "champion" n=12 scored 17.83 here vs our 31.32.
; It is hardware/build-specific — MEASURE it, never inherit a published value.
; ngram-mod REMOVED: measured a ~4% NET LOSS on first-exposure text (n=6 with
; ngram 28.95/24.89 vs 30.21/26.55 without). Its only gain is replaying output it
; has already emitted, which inflates repeat-prompt benchmarks but is not typical
; first-pass work. Re-add `,ngram-mod` + `spec-ngram-mod-n-min = 24` only if a
; real repetitive-editing workload justifies the 4%.
spec-draft-n-max = 5
ctx-size = 262144
batch-size = 2048
ubatch-size = 512
; 🔴 parallel = 2, NOT 1. MUST be >= 2 on any model llama-watchdog probes.
; watchdog.py:pin_slot() pins the 60s probe to max(slot_id) so it cannot LRU-steal
; a conversation's cached prefix. At parallel = 1 that IS the only slot, so the
; 2-token probe (f_sim ~0 vs any real conversation) OVERWRITES the conversation's
; prompt cache every 60 seconds and every turn pays a FULL re-prefill.
; PROVEN LIVE 2026-08-20 on DS4 slot 2: 1 -> 2701 tokens -> back to 1 within 75 s.
; MEASURED over 9,698 Hermes calls: every parallel>=2 model gets 79-96% cache
; reuse; the two parallel=1 models got 0-18%, and this model's median latency was
; 373.0 s vs the old qwen3.6-35b's 15.0 s at parallel=2 on a near-identical median
; prompt (56,611 vs 60,100 tokens). That is 25x, and it is the SLOT COUNT, not the
; model -- decode here is genuinely 31-33 t/s.
; ⚠️ Costs ~0.25 GB of compute buffer and ZERO KV: under kv-unified the KV buffer
; is ctx-size TOTAL across slots, never per-slot.
parallel = 2
kv-unified = true
cache-type-k = q8_0
cache-type-v = q8_0
slot-prompt-similarity = 0.5
no-mmproj = true
load-on-startup = false
